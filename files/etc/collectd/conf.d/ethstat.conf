# Hardware (switch MIB) byte counters of the WAN port. The netdev counters
# used by the interface plugin miss the traffic forwarded by hardware flow
# offloading (PPE); these counters include it.
# Included via luci_statistics.collectd.Include (see 99-custom-settings).
# Graph: Statistics -> Graphs -> "Ethernet (hardware counters)".
LoadPlugin ethstat
<Plugin ethstat>
	Interface "wan"
	Map "RxBytes" "derive" "rx_bytes"
	Map "TxBytes" "derive" "tx_bytes"
	MappedOnly true
</Plugin>
