# TCP BBR + FQ_CODEL + TCP FastOpen
net.core.default_qdisc=fq_codel
net.ipv4.tcp_congestion_control=bbr
net.ipv4.tcp_fastopen=3

# Conntrack optimization for 256MB RAM & HFO
net.netfilter.nf_conntrack_max=32768
net.netfilter.nf_conntrack_tcp_timeout_established=7200
net.netfilter.nf_conntrack_udp_timeout=60
net.netfilter.nf_conntrack_udp_timeout_stream=180

# Global socket flow table for RFS. Packet steering only sets the per-queue
# rps_flow_cnt (network.globals.steering_flows); without this table RFS stays
# inactive. Affects only traffic terminated on the router itself.
net.core.rps_sock_flow_entries=1024

# ZRAM-optimized VM parameters
vm.swappiness=100
vm.page-cluster=0
vm.vfs_cache_pressure=50
