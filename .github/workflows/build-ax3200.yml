# Build the Xiaomi AX3200 / Redmi AX6S firmware with build.sh and publish it as a
# GitHub release. Run it manually: Actions -> "Build AX3200 firmware" -> Run workflow.
name: Build AX3200 firmware

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (empty: v<OpenWrt version>-ax3200-r<next number>)'
        required: false
        default: ''
      prerelease:
        description: 'Publish as a pre-release'
        type: boolean
        default: false
      upgrade:
        description: 'Update from LuCI (System -> AX3200 / AX6S build updates): auto; reset (only without keeping the settings); manual (no update button)'
        type: choice
        options:
          - auto
          - reset
          - manual
        default: auto
      upgrade_note_en:
        description: 'For reset/manual: why, in English (shown on the router)'
        required: false
        default: ''
      upgrade_note_ru:
        description: 'For reset/manual: why, in Russian (shown on the router)'
        required: false
        default: ''
      upgrade_url:
        description: 'For reset/manual: link to the instructions (optional)'
        required: false
        default: ''
      runner:
        description: 'Runner image'
        type: choice
        options:
          - ubuntu-26.04
          - ubuntu-24.04
        default: ubuntu-26.04

permissions:
  contents: write
  # Signed build provenance: the OIDC token for the Sigstore certificate and storing the attestation
  id-token: write
  attestations: write

concurrency:
  group: build-ax3200
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and release
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 345
    env:
      TARGET_DIR: bin/targets/mediatek/mt7622

    steps:
      # A full build with CONFIG_ALL_KMODS=y needs ~25 GB; the runner guarantees 14 GB.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules /opt/microsoft /opt/az \
            /opt/google /usr/lib/jvm
          sudo docker image prune --all --force > /dev/null || true
          sudo apt-get clean
          df -h /
          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [ "$avail" -lt 35 ]; then
            echo "::error::Only ${avail} GB free, the build needs ~25 GB plus headroom"
            exit 1
          fi

      # Full history: scripts/getver.sh derives the r<number> revision from it, and the
      # tags are needed to number the release.
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Before the build: the image records its release for the update check on the router
      - name: Choose release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          UPGRADE: ${{ inputs.upgrade }}
          NOTE_EN: ${{ inputs.upgrade_note_en }}
          NOTE_RU: ${{ inputs.upgrade_note_ru }}
        run: |
          ver=$(grep -oP '(?<=,\$\(VERSION_NUMBER\),)[^)]*' include/version.mk)
          if [ -n "$INPUT_TAG" ]; then
            tag=$INPUT_TAG
          else
            last=$(git tag -l "v${ver}-ax3200-r*" | sed -n "s/^v${ver}-ax3200-r\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1)
            tag="v${ver}-ax3200-r$(( ${last:-0} + 1 ))"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ax3200-r[0-9]+$ ]]; then
            echo "::error::Tag $tag does not look like v<OpenWrt version>-ax3200-r<number>, which the update check on the router expects"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          if [ "$UPGRADE" != auto ] && { [ -z "${NOTE_EN// }" ] || [ -z "${NOTE_RU// }" ]; }; then
            echo "::error::upgrade=$UPGRADE needs both notes (upgrade_note_en, upgrade_note_ru)"
            exit 1
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore source downloads
        uses: actions/cache@v6
        with:
          path: dl
          key: dl-${{ hashFiles('feeds.conf.default', 'include/kernel-*', 'target/linux/generic/kernel-*') }}-${{ github.run_id }}
          restore-keys: dl-

      # The compiler cache of the previous run: later builds only recompile what changed. The host
      # compiler differs between runner images, so each image has its own cache.
      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ inputs.runner }}-${{ github.run_id }}
          restore-keys: ccache-${{ inputs.runner }}-

      - name: Build firmware
        env:
          AX3200_RELEASE: ${{ steps.tag.outputs.tag }}
          AX3200_REPO: ${{ github.repository }}
          # OpenWrt keeps the cache uncompressed; the Actions cache compresses it
          CCACHE_MAXSIZE: 5G
        run: ./build.sh --install-deps --ccache 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: Prepare release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          ver: ${{ steps.tag.outputs.ver }}
          tag: ${{ steps.tag.outputs.tag }}
          UPGRADE: ${{ inputs.upgrade }}
          NOTE_EN: ${{ inputs.upgrade_note_en }}
          NOTE_RU: ${{ inputs.upgrade_note_ru }}
          UPGRADE_URL: ${{ inputs.upgrade_url }}
        run: |
          # Same files as build.sh leaves in the target directory (without packages/)
          mkdir -p release
          find "$TARGET_DIR" -maxdepth 1 -type f -exec cp {} release/ \;
          (cd release && sha256sum -c --quiet sha256sums)

          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          prefix=openwrt-mediatek-mt7622-xiaomi_redmi-router-ax6s
          prev=$(git describe --tags --abbrev=0 --match 'v*-ax3200-r*' HEAD 2> /dev/null || true)

          # release.json for the update check on the router; it carries over the releases
          # listed in the previous one (releases before r10 have none)
          if [ -n "$prev" ]; then
            gh release download "$prev" --repo "$GITHUB_REPOSITORY" --pattern release.json --output prev-release.json 2> /dev/null || true
          fi
          python3 .github/scripts/ax3200-release-json.py --tag "$tag" --commit "$GITHUB_SHA" --repo-url "$url" \
            --image "release/$prefix-squashfs-sysupgrade.itb" --prev-tag "$prev" --prev-json prev-release.json \
            --upgrade "$UPGRADE" --note-en "$NOTE_EN" --note-ru "$NOTE_RU" --upgrade-url "$UPGRADE_URL" > release/release.json
          # GitHub lists the assets below the notes, so the notes start with direct links to
          # the two images most people need and keep everything else in collapsed sections.
          link() { echo "[\`…${1#"$prefix"}\`]($url/releases/download/$tag/$1)"; }
          size() { numfmt --to=iec-i --suffix=B --format='%.1f' "$(stat -c %s "release/$1")" | sed 's/[KMG]iB$/ &/'; }
          {
            echo "Optimized OpenWrt **${ver}** for **Xiaomi AX3200 / Redmi AX6S** · [Installation guide]($url/blob/$GITHUB_SHA/README.md#installation) · [Инструкция на русском]($url/blob/$GITHUB_SHA/README.ru.md#установка)"
            echo
            echo "### Download"
            echo
            echo "| | File | Size |"
            echo "|---|---|---|"
            echo "| **First installation** from the stock firmware (XMiR-Patcher) or from OpenWrt ≤ 23.05 | $(link "$prefix-factory.bin") | $(size "$prefix-factory.bin") |"
            echo "| **Upgrade** from OpenWrt 24.10 / 25.12, keeps the settings | $(link "$prefix-squashfs-sysupgrade.itb") | $(size "$prefix-squashfs-sysupgrade.itb") |"
            echo
            echo "<details><summary>Other files</summary>"
            echo
            echo "| File | Purpose |"
            echo "|---|---|"
            echo "| \`$prefix-sysupgrade.ubi\` | Raw UBI image for older builds that reject the \`.itb\` |"
            echo "| \`$prefix-ubi-loader.itb\` | Second-stage U-Boot (\`ubi-loader\`); \`sysupgrade\` does not update it |"
            echo "| \`$prefix-initramfs-recovery.itb\` | Initramfs recovery image (TFTP) |"
            echo "| \`mt7622-ram-1ddr-bl2.bin\`, \`mt7622-ram-2ddr-bl2.bin\` | BL2 that runs from RAM, for recovery over UART (e.g. \`mtk_uartboot\`) |"
            echo "| \`$prefix.manifest\` | Installed packages and their versions |"
            echo "| \`config.buildinfo\`, \`feeds.buildinfo\`, \`version.buildinfo\`, \`profiles.json\` | Build configuration, feed revisions, OpenWrt revision, image metadata |"
            echo "| \`sha256sums\` | SHA256 of all files |"
            echo "| \`release.json\` | Release information for the firmware update check on the router (*System → AX3200 / AX6S build updates*) |"
            echo
            echo "</details>"
            if [ -n "$prev" ]; then
              echo
              echo "<details><summary>Changes since $prev</summary>"
              echo
              git log --first-parent --format="* %s ([\`%h\`]($url/commit/%H))" "$prev..HEAD"
              echo
              echo "</details>"
            fi
            echo
            echo "<details><summary>Build details</summary>"
            echo
            echo "* Commit [\`${GITHUB_SHA::10}\`]($url/commit/$GITHUB_SHA), built by [GitHub Actions]($url/actions/runs/$GITHUB_RUN_ID)"
            echo "* Revision: \`$(cat "$TARGET_DIR/version.buildinfo")\`"
            echo "* Kernel vermagic (official, compatible with official kmods): \`$(cat vermagic-mediatek-mt7622-"$ver".list)\`"
            echo
            echo "</details>"
            echo
            echo "<details><summary>SHA256 checksums</summary>"
            echo
            echo '```'
            cat release/sha256sums
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<details><summary>Verifying the files</summary>"
            echo
            echo "Every file has a signed build provenance attestation that ties it to this workflow run and commit. With the [GitHub CLI](https://cli.github.com/):"
            echo '```'
            echo "gh attestation verify $prefix-squashfs-sysupgrade.itb --repo $GITHUB_REPOSITORY"
            echo '```'
            echo "The release is immutable: its files and tag cannot be changed after publication. To check the release and a downloaded file against it:"
            echo '```'
            echo "gh release verify $tag --repo $GITHUB_REPOSITORY"
            echo "gh release verify-asset $tag $prefix-squashfs-sysupgrade.itb --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "</details>"
          } > release-notes.md

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=Optimized OpenWrt $ver for Xiaomi AX3200 / Redmi AX6S ($tag)" >> "$GITHUB_OUTPUT"

      # Sigstore-signed SLSA provenance for every published file, recorded in the public
      # transparency log: gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: release/*

      # gh uploads the files to a draft and publishes it afterwards, so this also works
      # with immutable releases (Settings -> General -> Releases -> Enable release immutability).
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" release/* --target "$GITHUB_SHA" \
            --title "$TITLE" --notes-file release-notes.md "${flags[@]}"
          immutable=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .immutable)
          if [ "$immutable" != "true" ]; then
            echo "::warning::Release $TAG is not immutable, although its notes say so: enable Settings -> General -> Releases -> Enable release immutability"
          fi

      - name: Disk usage
        if: always()
        run: df -h /
